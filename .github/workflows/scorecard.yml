name: Scorecard

# Re-measure the published scorecard on a schedule.
#
# WHY A SCHEDULE AND NOT THE RELEASE WORKFLOW: a release is a rare, deliberate
# event, and the six repositories this measures are not ours and move daily.
# A number that is three weeks stale describes a world that no longer exists.
# Weekly is also the cadence at which "re-measure the whole table on one date"
# is a question somebody actually asks, which is the discipline the published
# table depends on.
#
# It runs on the default branch, so this is also where the PR job's promotion
# criterion gets its evidence: three consecutive green runs ON MAIN, not three
# on a pull request.
on:
  schedule:
    # Sundays, 06:17 UTC. Deliberately not :00 -- the top of the hour is the
    # busiest window on GitHub's scheduler and runs get delayed there.
    - cron: "17 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # NON-BLOCKING, for the same reason as the scorecard job in ci.yml: a peer
  # repository renaming a directory, or going unreachable, must not be able to
  # turn our build red or page anybody. The exit code is measured and written
  # into the job summary rather than propagated, so a regression is visible in
  # the summary and in the artifact without generating noise nobody can act on.
  #
  # What this job does NOT do: it does not write to the repository. A schedule
  # with write access would eventually open a commit nobody reviewed, and a
  # benchmark that rewrites its own baseline is a benchmark that cannot
  # regress. The snapshot is an artifact; landing it stays a human decision,
  # made on a pull request where the diff is readable.
  measure:
    # The same `continue-on-error` the pull-request job carries. The step below
    # already swallows a gate regression, so without this line only a hard
    # crash -- a script that raises before it writes scorecard.json, which then
    # trips `if-no-files-found: error` -- could turn the default branch red. That
    # is the opposite of why this job exists. A failed measurement should be a
    # missed data point, not a build break.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.24"

      - name: Measure the scorecard
        id: measure
        # --online enables measure 5, one HTTP GET per package name. It is the
        # axis Mvge currently loses outright, so it is the one most worth
        # watching, and it is why this job needs network at all.
        #
        # --json writes the full result document alongside the table so a later
        # re-measurement can be diffed against a dated snapshot rather than
        # against someone's memory of a terminal.
        run: |
          set +e
          uv run --no-project python scripts/scorecard.py \
            --online --markdown --json scorecard.json > report.md 2>&1
          code=$?
          set -e
          {
            echo "## Scorecard (script exit \`$code\`)"
            echo
            cat report.md
          } >> "$GITHUB_STEP_SUMMARY"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # The summary above is the record. Do not fail the run here.
          exit 0

      - name: Upload the dated snapshot
        # `always()` because the step above always succeeds by construction,
        # and because a peer failure must still leave the measurement behind
        # for whoever looks at it next.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-${{ github.run_number }}
          path: |
            scorecard.json
            report.md
          if-no-files-found: error
          retention-days: 90
