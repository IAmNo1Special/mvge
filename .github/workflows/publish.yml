name: Publish

# Publishing to PyPI is separate from release.yml on purpose. That workflow
# generates the changelog and creates the GitHub Release; this one owns the
# package index. A failure to upload must not block the changelog, and a tag
# must never produce a GitHub Release without the upload having been attempted.
#
# Uploads authenticate with OIDC trusted publishing: GitHub mints a short-lived
# token from `id-token: write`, PyPI exchanges it for a 15-minute upload
# credential, and nothing long-lived is stored in this repository. Each of the
# eight project names needs a trusted publisher registered on its own PyPI
# project page. See "PyPI setup" in docs/agents/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g., v0.6.5)"
        required: true
        type: string
      dry_run:
        description: "Build and validate, but upload nothing"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Refuse to upload wheels that cannot install on another machine. This is the
  # gate that keeps a release from making things worse than publishing nothing.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      order: ${{ steps.order.outputs.packages }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.24"

      - name: Resolve the release version from the tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Derive the publish order from the dependency graph
        id: order
        run: |
          packages="$(python3 scripts/check_publish.py --list | paste -sd' ' -)"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Publish order: $packages"

      # --no-sources: a published wheel must not depend on this workspace
      # resolving its own siblings. See scripts/check_publish.py.
      - name: Build every distribution
        run: |
          for package in $(python3 scripts/check_publish.py --list); do
            echo "::group::build $package"
            uv build --no-sources --package "$package" --out-dir "dist/$package"
            echo "::endgroup::"
          done

      - name: Validate wheel metadata and lockstep versions
        run: |
          python3 scripts/check_publish.py \
            --dist-dir dist \
            --version "${{ steps.version.outputs.version }}"

      - name: Report what would be uploaded
        run: |
          echo "### Release ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | Files |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for package in $(python3 scripts/check_publish.py --list); do
            files="$(ls "dist/$package" | paste -sd' ' -)"
            echo "| \`$package\` | $files |" >> "$GITHUB_STEP_SUMMARY"
          done

      # Each job gets its own runner, so the publish job starts with a clean
      # workspace and no dist/. The built distributions have to cross the job
      # boundary as an artifact or uv publish finds nothing to upload.
      - name: Hand the built distributions to the publish job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    # One upload attempt per name, no sleeping. A 429 here means PyPI's
    # new-project quota is full, and that quota is measured in a trailing
    # 24 hour window. No retry inside a run can outrun it, so a retry loop
    # cannot help; it can only spend runner time, and a refused request may
    # itself count against the window. The run reports when a slot frees and
    # stops. Re-dispatching after that time is the whole recovery.
    timeout-minutes: 30
    # The environment is not a credential gate any more: nothing is stored
    # there to gate. It stays because PyPI's trusted publisher names it, and
    # PyPI rejects an OIDC token whose job did not come from the environment
    # the publisher was registered against.
    environment: pypi
    permissions:
      contents: read
      # id-token: write is what lets GitHub mint the OIDC token that PyPI
      # exchanges for a 15-minute upload credential. Without it there is no
      # token to exchange and the upload fails.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.24"

      # The exact files preflight validated. Re-downloading them is what makes
      # the gate mean something: if upload-artifact ever hands back different
      # bytes, the validated set is not the uploaded set.
      - name: Fetch the validated distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload in dependency order
        env:
          # `always` stops uv hunting for a credential by other means, and keeps
          # the job honest if the mechanism changes later. It is not the control:
          # a credential exported into this job would be used whatever this says.
          # The control is that no credential exists here at all.
          UV_PUBLISH_TRUSTED_PUBLISHING: always
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            # GitHub sets this on the runner for a job granted `id-token: write`
            # and on no other job. Without the check a dropped permission
            # surfaces as uv's generic "Trusted publishing failed ...
            # `_/oidc/audience`", which reads like PyPI refusing the project
            # rather than a permissions mistake.
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
              echo "::error::No OIDC token was minted, so the upload cannot authenticate. The publish job needs permissions.id-token: write. If that is set, PyPI has no trusted publisher registered for this project name (see docs/agents/releasing.md)."
              exit 1
            fi
            if [ ! -d "dist" ]; then
              echo "::error::dist/ did not arrive from preflight"
              exit 1
            fi
          fi

          for package in ${{ needs.preflight.outputs.order }}; do
            echo "::group::upload $package"
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              uv publish --dry-run "dist/$package/*"
              echo "::endgroup::"
              continue
            fi

            # PyPI versions are immutable, so a release that failed partway can
            # only be finished by uploading what is still missing. Deciding
            # what that is was uv's job, via UV_PUBLISH_CHECK_URL, and it could
            # not do it: uv compares the rebuilt file's hash against the
            # published one and errors when they differ. A wheel embeds
            # `Generator: uv <version>` in its WHEEL metadata and setup-uv@v7
            # installs the newest uv available, so the same commit rebuilt on a
            # different day is a different file. Measured on v0.6.17: the
            # published mvge-0.1.2-py3-none-any.whl carries `Generator:
            # uv 0.12.24` and a rebuild of the identical commit carries a
            # different version. The entire payload is byte-identical; only that
            # line and the RECORD hash of it differ. uv refused with "Local
            # file and index file do not match", which is the resume mechanism
            # refusing to resume.
            #
            # Presence is therefore asked by filename. A version can exist with
            # a file missing, because an upload can die between two files, so
            # this is per file and not per version.
            missing="$(python3 scripts/published_files.py \
              --package "$package" --version "$VERSION" --dist-dir dist)"
            if [ -z "$missing" ]; then
              echo "::notice::$package $VERSION is already on PyPI; skipping"
              echo "::endgroup::"
              continue
            fi
            echo "::notice::$package $VERSION: $(echo "$missing" | wc -l) of \
              $(ls "dist/$package" | wc -l) file(s) not yet on PyPI"

            files=""
            for name in $missing; do
              files="$files dist/$package/$name"
            done

            # Run once and report what the server said. A failure that is not
            # rate limiting -- bad metadata, a rejected filename, no
            # permission -- is a real defect and stops the release here.
            set +e
            output="$(uv publish $files 2>&1)"
            status=$?
            set -e
            echo "$output"
            if [ "$status" -ne 0 ]; then
              if printf '%s' "$output" | grep -qi '429\|too many new projects'; then
                echo "::error::$package was refused: PyPI's new-project quota is full. This is not a packaging fault and no retry inside this run can outrun a 24 hour window."
                {
                  echo
                  python3 scripts/pypi_new_project_window.py
                } >> "$GITHUB_STEP_SUMMARY" || true
                echo "::error::A slot next frees at the time printed in the step summary. Re-dispatch this workflow then; it skips what already landed."
                exit 1
              fi
              # PyPI answers a missing or mismatched trusted publisher with a
              # 403 that names the project and nothing else actionable. Left
              # generic, this reads as "the packaging is broken" and sends
              # whoever reads it to the wrong page, because every distribution
              # in this loop is built and validated by preflight already.
              #
              # Read the scope of the failure as the diagnosis: one token is
              # minted for the job and offered to every upload here, so a wrong
              # workflow filename or environment refuses all eight, while a
              # refusal partway means only those names are unregistered.
              if printf '%s' "$output" | grep -qi "not valid for project"; then
                echo "::error::$package was refused: PyPI has no trusted publisher that matches this run's OIDC token for '$package'. Register one at https://pypi.org/manage/project/$package/settings/publishing/ with owner IAmNo1Special, repository mvge, workflow filename publish.yml, environment pypi. Everything before this package already uploaded; re-run the same tag to upload the rest."
                exit "$status"
              fi
              echo "::error::$package failed for a reason other than rate limiting or a missing trusted publisher"
              exit "$status"
            fi
            echo "::endgroup::"
          done

  # The acceptance test. This job checks out nothing, so uvx resolves the
  # command from PyPI exactly as a stranger's machine would.
  verify:
    # preflight is in `needs` because the version is read from its output, and
    # a job that does not need another job reads that job's outputs as the
    # empty string. `verify` needed only `publish`, so `needs.preflight.outputs
    # .version` was blank, and this job polled
    # `https://pypi.org/pypi/<name>//json` -- which is 200 for every package
    # that has ever existed. Measured on the v0.6.25 tag: every line printed
    # `mvge : HTTP 200` with the version blank, over a run whose publish
    # had been refused. `wait_for_pypi.py` refuses a version it cannot name
    # rather than asking that question, so the next regression of this fails
    # the run instead of greening it.
    needs: [publish, preflight]
    # dry_run is declared type: boolean, so it arrives as a boolean. Comparing
    # it to the string 'true' is never equal, which sent verify out to assert
    # that eight packages were on PyPI after a dry run uploaded none of them.
    # A tag push has no inputs at all, and null != true is what runs verify.
    #
    # `always()` is what makes this job survive a failed publish. Without it
    # `needs: publish` skips verify the moment publish fails, and a publish that
    # died on the seventh of eight names leaves six on PyPI with nothing in the
    # run saying which two are missing. v0.6.20 through v0.6.23 were each cut
    # three times and each half-landed on `mvge` and `mvge-desktop` with no
    # diagnosis, because the job whose whole purpose is that diagnosis was the
    # one being skipped. The run is red either way; this way it is red for a
    # reason a person can act on.
    if: ${{ always() && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.24"
          enable-cache: false

      # An upload returning is not a release being installable; the index is
      # what decides that, and it lags. Measured on v0.6.19: the upload
      # returned at 00:03:12Z and this run's first `uvx` failed at 00:03:26Z
      # with "there is no version of mvge==0.6.19" -- a release that had
      # already landed, measured two seconds too early. So this waits, and the
      # wait is also what turns the failure back into a diagnosis: a name that
      # is still absent when the wait expires is a half-landed release, which
      # is the report this job exists to make.
      #
      # What it waits *for* is in scripts/wait_for_pypi.py, and it is not the
      # version-specific URL. `/pypi/<name>/<version>/json` answers 200 while
      # the index `uvx` resolves against is still stale, and 404 after the
      # release published, because `published_files.py` asked that exact URL
      # seconds before the upload in the publish job. The project document
      # `/pypi/<name>/json` is the one cached under the key the upload purges,
      # so it is fresh when the index is fresh.
      - name: Wait for the released version to reach the index
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          args=(--version "$VERSION")
          for package in $(python3 scripts/check_publish.py --list); do
            args+=(--package "$package")
          done
          if ! python3 scripts/wait_for_pypi.py "${args[@]}"; then
            echo "::error::$VERSION is not on the index at every name in the publish order. The lines above say which, and whether the index answered at all. If publish was refused, read that job's log; if it uploaded, this is propagation lag and a re-dispatch is the recovery."
            exit 1
          fi

      # Only meaningful against a publish that completed. When publish failed the
      # step above already says why, and installing from a half-landed release
      # would fail in a way that reads as a packaging fault rather than the
      # upload it actually was.
      - name: Run the command a stranger types
        if: ${{ needs.publish.result == 'success' }}
        run: uvx mvge --help

      # verify ran for a reason, so it has to carry publish's failure forward. A
      # green verify over a red publish would read as a pass.
      - name: Carry the publish result forward
        if: ${{ needs.publish.result != 'success' }}
        run: |
          echo "::error::publish ended ${{ needs.publish.result }}; see the upload log for the PyPI refusal."
          exit 1

  # The half `verify` above structurally cannot reach. `--help` returns before a
  # Realm is contacted, so a release whose key never loads, whose Rune is
  # missing, or whose Tome never reaches disk is green and still unusable. This
  # job installs the Realm and the Mvge, runs one real task, and asserts on the
  # artifact and the persisted session.
  #
  # It checks out the repository, unlike `verify` above, and that is not a
  # contradiction: only the harness script is taken from the checkout. Every
  # mvge the run touches still comes from PyPI via uvx, so the thing under test
  # is the published distribution and never the workspace.
  verify-install:
    needs: publish
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.24"
          enable-cache: false

      - name: Resolve the released version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # The default Realm serves its free tier keyless, so this gate needs no
      # secret at all. An earlier revision failed on purpose when
      # OPENROUTER_API_KEY was absent, on the reasoning that a skipped gate is
      # indistinguishable from a passing one. That reasoning was right and the
      # conclusion was wrong: the gate was not skipping, it was refusing to run
      # at all over a credential it no longer spends. A secret here would also
      # mean this gate cannot run on a fork, and a fork is exactly where a
      # stranger's first contact with this repository happens.
      #
      # OPENROUTER_API_KEY is still passed through for a `--provider openrouter`
      # run. That is optional: the harness exits 2 with a message naming the
      # variable if it is asked for a billing Realm and finds none, which is a
      # clearer failure than a silently keyless request.

      # Stdlib only on purpose: the harness must be runnable without a sync, so
      # the thing standing between a release and this check cannot itself fail
      # to install.
      #
      # bubblewrap is what turns "a scratch HOME on a runner that already has a
      # checkout" into something closer to a stranger's machine: the harness
      # re-runs itself in a mount namespace where this job's checkout and the
      # runner's own HOME do not exist. A runner is fresh enough that this is
      # belt-and-braces, but the gate costs nothing to be as strong as it can be.
      - name: Install bubblewrap for the sandbox
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap

      # The acceptance test starts here, and it must not start until the
      # release is installable. PyPI answers an upload before the index that
      # `uvx` resolves against holds the release: the simple index is served
      # from cache -- measured as `cache-control: max-age=600` on
      # `https://pypi.org/simple/mvge/` -- and only the upload's cache purge
      # makes it fresh, which takes a moment. Measured on v0.6.19: the upload
      # returned at 00:03:12Z and this job's first uvx failed at 00:03:26Z with
      # "there is no version of mvge==0.6.19", on a release that had already
      # landed.
      #
      # `--resolve` waits for the command a stranger types, run verbatim:
      # `uvx --from mvge==<version> mvge --help`. That resolves the whole
      # runtime closure, so it also proves the seven distributions the command
      # needs are on the index together, which is the half of the question
      # `verify` above answers for all eight.
      #
      # It waits last on purpose. The bubblewrap install above it is fifteen
      # seconds of propagation the run gets for free, so a wait that starts
      # after it usually does not wait at all. That is a saving, not the gate:
      # the gate is this step, and it is what fails red if the release never
      # becomes installable.
      - name: Wait for the release to become installable
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! python3 scripts/wait_for_pypi.py --version "$VERSION" --resolve; then
            echo "::error::$VERSION is not installable yet. If the wait above says it is on the index and uvx still cannot install it, this is PyPI propagation lag, not a packaging fault: re-dispatch this run. If it is not on the index at all, publish did not upload it -- read that job's log."
            exit 1
          fi

      - name: Install the Realm, the Mvge, and run one real task
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/verify_install.py --version "${{ steps.version.outputs.version }}"
