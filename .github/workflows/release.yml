name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.0.0)"
        required: true
        type: string
      dry_run:
        description: "Run without creating release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # Verification gate: red code cannot ship. Bare full-suite run so the
  # pyproject [tool.coverage.report] pyproject coverage floor applies
  # (TESTING.md sections 3 and 6). Both publish jobs below depend on this.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.24"
          enable-cache: true
      - run: uv sync
      - name: Full suite with the combined coverage floor
        run: uv run python -m pytest --cov

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1

      - name: Generate changelog
        id: changelog
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            git-cliff --unreleased --tag "$VERSION" --config cliff.toml
          else
            git-cliff --unreleased --tag "$VERSION" --config cliff.toml --output CHANGELOG.md
          fi

      - name: Create Release
        if: github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: Release ${{ steps.changelog.outputs.tag }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.event.inputs.version, '-') }}
          generate_release_notes: false

  changelog:
    needs: verify
    # Dry runs must not mutate the repo; mirrors the Create Release guard
    if: github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1

      - name: Generate changelog
        run: |
          git-cliff --config cliff.toml --output CHANGELOG.md

      - name: Commit changelog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "chore: update CHANGELOG.md [skip ci]"
          file_pattern: CHANGELOG.md
