name: Feature Request
description: Propose an enhancement, new spell, or architecture capability for Mvge
title: "feat: "
labels: ["needs-triage", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement for Mvge. Please describe the motivation and design from first principles.
  - type: dropdown
    id: component
    attributes:
      label: Target Component / Package
      description: Select the primary Mvge component targeted by this request.
      options:
        - mvge.agent (Core loop, session lifecycle, harness)
        - mvge.provider (Realm protocol, OpenRouter streaming)
        - mvge.tome (JSONL persistence, file locking, branching)
        - mvge.runes (Extensions, sigil hooks, sandboxing)
        - mvge.cli (Terminal interface, REPL, CLI commands)
        - mvge-desktop (Desktop NiceGUI interface)
        - coding-mvge (Default coding agent package)
        - all / architecture
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is this related to a problem or limitation in the current workflow?
      placeholder: Describe the current limitation or user friction.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution / Interface
      description: A detailed description of the suggested behavior, API design, or protocol adherence.
      placeholder: Describe how this should work, including interfaces or spell signatures where applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative designs, workarounds, or approaches considered.
    validations:
      required: false
