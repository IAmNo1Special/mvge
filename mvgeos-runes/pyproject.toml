[project]
name = "mvgeos-runes"
version = "0.7.8"
description = "Extension system: manifest, loader, and sigil hook protocol"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    # Explicit floors: uv_build does not substitute the workspace version, so
    # bare names ship as unbounded Requires-Dist. Bumped in lockstep by ci.yml.
    "httpx>=0.27",
    "mvgeos-core==0.7.8",
    "packaging",
    "pyyaml>=6.0",
    "watchdog>=6.0.0",
]

[tool.uv.sources]
mvgeos-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.2,<0.14"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"
