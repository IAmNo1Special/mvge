[project]
name = "mvge"
version = "0.2.30"
description = "mvge — a Python-based AI coding agent"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "click>=8.0",
    "httpx>=0.28.1",
    "packaging>=24.0",
    "portalocker>=3.0.0",
    "prompt-toolkit>=3.0",
    "pydantic>=2.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.27.1",
    "watchdog>=6.0.0",
]

[project.scripts]
mvge = "mvge.cli.main:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "git-cliff>=2.13.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.2",
    "types-pyyaml>=6.0.12.20260815",
]

[project.urls]
Repository = "https://github.com/IAmNo1Special/mvge"

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = ["prototypes"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "C4",
    "PT",
    "T20",
    "RSE",
    "PGH",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "PT001"]
"*/__init__.py" = ["E402", "F401"]
# Release tooling reports to a terminal; printing is its interface, not a slip.
# mypy already excludes /scripts/ for the same reason.
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
exclude = ["(^|/)(tests|scripts|prototypes)/", "test_keys\\.py", "benchmarks"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "scripts/tests",
]
pythonpath = [".", "src", "scripts", "tests/unit/provider"]
python_files = "*.py"
python_classes = "Test*"
python_functions = "test_*"
consider_namespace_packages = false
addopts = "--import-mode=importlib -W ignore::RuntimeWarning"

[tool.coverage.run]
branch = true
source = [
    "mvge",
]
omit = [
    "src/mvge/__main__.py",
    "src/mvge/cli/__main__.py",
]

[tool.coverage.report]
fail_under = 90
