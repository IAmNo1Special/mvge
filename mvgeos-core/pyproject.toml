[project]
name = "mvgeos-core"
version = "0.6.28"
description = "Canonical loop vocabulary for MvgeOS: abort, invocations, spells, events, and the pure turn loop"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.13"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"
