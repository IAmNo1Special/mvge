# --no-sync is load-bearing: pre-commit stashes unstaged changes (including
# manifests) while hooks run; uv run's default auto-sync would then reinstall
# the environment against the stashed state, corrupting workspace editables.
# Sync explicitly via `uv sync` instead — never implicitly from a hook.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync python -m ruff check
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync python -m ruff format --check
        language: system
        types: [python]
        pass_filenames: true

      - id: mypy
        name: mypy
        entry: uv run --no-sync python -m mypy src
        language: system
        types: [python]
        pass_filenames: false

      # Fast unit-smoke run: no coverage gate (TESTING.md section 3).
      # CI owns coverage measurement over the hermetic whole.
      - id: pytest
        name: unit tests
        # `scripts/tests` last: it is the release tooling, not a package, and
        # it runs in about a tenth of a second.
        entry: uv run --no-sync python -m pytest tests/unit scripts/tests
        language: system
        types: [python]
        pass_filenames: false
