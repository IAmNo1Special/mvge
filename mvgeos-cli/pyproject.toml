[project]
name = "mvgeos-cli"
version = "0.7.2"
description = "CLI entry point for MvgeOS"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    # Explicit floors: uv_build does not substitute the workspace version, so
    # bare names ship as unbounded Requires-Dist. Bumped in lockstep by ci.yml.
    "mvgeos-agent==0.7.2",
    "mvgeos-core==0.7.2",
    "mvgeos-provider==0.7.2",
    "mvgeos-tome==0.7.2",
    "mvgeos-runes==0.7.2",
    "rich>=13.0",
    "typer>=0.27.1",
    "prompt-toolkit>=3.0",
    "click>=8.0",
]

[project.scripts]
mvgeos = "mvgeos_cli.main:main"

[tool.uv.sources]
mvgeos-agent = { workspace = true }
mvgeos-core = { workspace = true }
mvgeos-provider = { workspace = true }
mvgeos-tome = { workspace = true }
mvgeos-runes = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.2,<0.13"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"
