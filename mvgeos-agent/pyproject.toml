[project]
name = "mvgeos-agent"
version = "0.7.8"
description = "Core Mvge agent loop, invocation types, state management, and spell execution"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    # Explicit floors: uv_build does not substitute the workspace version, so
    # bare names ship as unbounded Requires-Dist. Bumped in lockstep by ci.yml.
    "mvgeos-core==0.7.8",
    "mvgeos-provider==0.7.8",
    "mvgeos-tome==0.7.8",
    "mvgeos-runes==0.7.8",
    "pydantic>=2.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
]

[tool.uv.sources]
mvgeos-core = { workspace = true }
mvgeos-provider = { workspace = true }
mvgeos-tome = { workspace = true }
mvgeos-runes = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.2,<0.14"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"
