[project]
name = "mvgeos-gui"
version = "0.7.0"
description = "Desktop GUI for MvgeOS powered by NiceGUI"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    # Explicit floors: uv_build does not substitute the workspace version, so
    # bare names ship as unbounded Requires-Dist. Bumped in lockstep by ci.yml.
    "keyring>=24.0",
    "mvgeos-agent==0.7.0",
    "mvgeos-core==0.7.0",
    "mvgeos-provider==0.7.0",
    "mvgeos-runes==0.7.0",
    "mvgeos-tome==0.7.0",
    "nicegui>=2.10.0",
    "pathspec>=0.12.0",
    "pywebview>=6.2.1",
]

[project.scripts]
mvgeos-gui = "mvgeos_gui.main:main"

[tool.uv.sources]
mvgeos-agent = { workspace = true }
mvgeos-core = { workspace = true }
mvgeos-provider = { workspace = true }
mvgeos-runes = { workspace = true }
mvgeos-tome = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.2,<0.14"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"
